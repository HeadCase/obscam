logLevel: info
logDestinations: [stdout]

# Read-only readiness evidence for the Rust owner. The listener exists only on
# the namespace-private veth and is not translated to a browser-facing address.
api: yes
apiAddress: 169.254.218.2:9997
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ["127.0.0.1", "::1", "169.254.218.1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

rtsp: no

rtmp: no
hls: no
srt: no
moq: no

webrtc: yes
webrtcAddress: 169.254.218.2:8889
webrtcEncryption: no
webrtcLocalUDPAddress: 169.254.218.2:8189
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - 10.164.190.1
  - 192.168.1.200

paths:
  obscam:
    source: udp+rtp://169.254.218.2:5004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=ObsCam
      c=IN IP4 169.254.218.2
      t=0 0
      m=video 5004 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
      a=recvonly
