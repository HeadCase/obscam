[project]
name = "obscam"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "zwoasi>=0.2.0",
  "pillow>=10.0.0",
  "numpy>=2.2.6",
  "opencv-python>=4.12.0.88",
  "loguru>=0.7.0",
  "gphoto2>=2.6.2",
  "pytest>=8.4.1",
]

[project.scripts]
obscam = "obscam:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.31.2",
    "ipdb>=0.13.13",
 "ipython>=9.4.0",
]
