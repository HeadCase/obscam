[project]
name = "obscam"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["zwoasi>=0.2.0"]

[project.scripts]
obscam = "obscam.main:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "deptry>=0.23.1",
  "ipdb>=0.13.13",
  "ipython>=9.4.0",
  "pre-commit>=4.2.0",
  # "pytest>=8.4.1",
  "ruff>=0.12.10",
  "ty>=0.0.1a16",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]              #, "tests"]
extend-exclude = [".venv"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = "./.venv"

[tool.deptry]
known_first_party = ["obscam"]
extend_exclude = []
