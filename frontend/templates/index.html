<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ObsCam - Observatory Monitor</title>

    <!-- External Libraries -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind CSS -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tokyo-night": {
                bg: "#1a1b26",
                surface: "#24283b",
                overlay: "#414868",
                muted: "#565f89",
                subtle: "#9aa5ce",
                text: "#c0caf5",
                blue: "#7aa2f7",
                purple: "#bb9af7",
                green: "#9ece6a",
                orange: "#ff9e64",
                red: "#f7768e",
                yellow: "#e0af68",
                cyan: "#7dcfff",
              },
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body
    class="bg-tokyo-night-bg text-tokyo-night-text min-h-screen"
    x-data="obsCam()"
  >
    <div class="viewer-shell">
      {% include "_viewer.html" %}
    </div>

    <script src="/static/js/obscam.js"></script>
  </body>
</html>
