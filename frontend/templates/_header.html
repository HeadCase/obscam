<!-- Header with Controls -->
<header
  class="bg-tokyo-night-surface/85 backdrop-blur-sm border border-tokyo-night-overlay rounded-md p-4"
>
  <div class="flex flex-wrap items-center gap-4">
    <!-- Dynamic Controls -->
    <div
      class="flex flex-wrap items-center justify-center gap-6"
      x-show="controlsReady"
    >
      <!-- Exposure Control -->
      <div class="flex flex-col gap-1 min-w-[180px]">
        <label
          class="flex justify-between items-center text-xs text-tokyo-night-subtle"
        >
          Exposure
          <span
            class="font-mono text-tokyo-night-blue"
            x-text="formatExposure(controls.exposure.value)"
            >--</span
          >
        </label>
        <input
          type="range"
          class="control-slider w-full h-2 bg-tokyo-night-overlay rounded-md outline-none"
          x-model="controls.exposure.index"
          :min="0"
          :max="controls.exposure.scale.length - 1"
          @input="updateControlValues()"
          @change="updateCameraSettings()"
        />
      </div>

      <!-- Gain Control -->
      <div class="flex flex-col gap-1 min-w-[180px]">
        <label
          class="flex justify-between items-center text-xs text-tokyo-night-subtle"
        >
          Gain
          <span
            class="font-mono text-tokyo-night-blue"
            x-text="controls.gain.value"
            >--</span
          >
        </label>
        <input
          type="range"
          class="control-slider w-full h-2 bg-tokyo-night-overlay rounded-md outline-none"
          x-model="controls.gain.index"
          :min="0"
          :max="controls.gain.scale.length - 1"
          @input="updateControlValues()"
          @change="updateCameraSettings()"
        />
      </div>

      <div
        class="flex items-center gap-4 min-w-[180px] text-xs text-tokyo-night-subtle"
      >
        <span
          >Last:
          <span
            class="text-tokyo-night-blue"
            x-text="telemetry.lastUpdate || '--'"
            >--</span
          ></span
        >
        <span
          >Age:
          <span
            class="text-tokyo-night-yellow"
            x-text="telemetry.frameAge || '--'"
            >--</span
          ></span
        >
      </div>
    </div>
  </div>
</header>
