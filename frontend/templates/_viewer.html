<!-- Main Camera Feed - Full Viewport -->
<div class="viewer-surface">
  <!-- MJPEG Stream -->
  <img
    x-show="streaming"
    x-ref="mjpegStream"
    :src="streamUrl"
    class="camera-feed block"
    @error="handleStreamError()"
    @load="handleStreamLoad()"
  />

  <!-- Loading Placeholder -->
  <div
    x-show="!streaming"
    class="viewport-placeholder flex items-center justify-center bg-tokyo-night-surface/20 border-2 border-dashed border-tokyo-night-overlay"
  >
    <div class="text-center">
      <div class="text-6xl mb-4">📸</div>
      <div class="text-tokyo-night-subtle">Starting camera feed...</div>
    </div>
  </div>
</div>
