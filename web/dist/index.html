<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>ObsCam</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23181b1f' stroke='%23aeb7c0'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23aeb7c0'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="viewer" aria-label="ObsCam observatory viewer">
      <section class="viewer__frame" data-viewer-frame aria-label="Camera frame">
        <video class="viewer__video" data-viewer-video autoplay muted playsinline></video>
        <canvas class="viewer__retained-frame" data-viewer-retained-frame hidden></canvas>
        <div class="viewer__unavailable" data-viewer-unavailable role="status" aria-live="polite">
          <span class="viewer__status" data-viewer-status>Unavailable</span>
          <span class="viewer__detail" data-viewer-detail>Capture · Encoder · Relay unavailable</span>
        </div>
      </section>

      <section class="status-bar" aria-label="Service status">
        <span class="status-bar__mark" aria-hidden="true"></span>
        <span data-service-status>Unavailable</span>
        <span class="status-bar__truth" data-service-detail>No trustworthy frame</span>
        <span class="status-bar__quality" data-service-quality>No quality samples</span>
        <button class="status-bar__download" data-service-quality-download type="button" disabled>Quality JSON</button>
      </section>

      <section class="control-tray" aria-label="Camera controls">
        <div class="control-tray__heading">
          <span>Exposure</span>
          <span data-control-status aria-live="polite">Control reconnecting</span>
          <button class="take-control" data-control="take-control" type="button" disabled>Take control</button>
        </div>
        <div class="exposure-grid" aria-label="Exposure choices">
          <button data-exposure-ms="30000" type="button" disabled>30 s</button><button data-exposure-ms="20000" type="button" disabled>20 s</button>
          <button data-exposure-ms="15000" type="button" disabled>15 s</button><button data-exposure-ms="10000" type="button" disabled>10 s</button>
          <button data-exposure-ms="5000" type="button" disabled>5 s</button><button data-exposure-ms="2000" type="button" disabled>2 s</button>
          <button data-exposure-ms="1000" type="button" disabled>1 s</button><button data-exposure-ms="500" type="button" disabled>500 ms</button>
          <button data-exposure-ms="300" type="button" disabled>300 ms</button><button data-exposure-ms="200" type="button" disabled>200 ms</button>
          <button data-exposure-ms="100" type="button" disabled>100 ms</button><button data-exposure-ms="50" type="button" disabled>50 ms</button>
          <button data-exposure-ms="20" type="button" disabled>20 ms</button><button data-exposure-ms="10" type="button" disabled>10 ms</button>
        </div>
        <div class="setting-evidence" data-setting-evidence="exposure" aria-label="Exposure state"></div>
        <label class="gain-control">
          <span>ISO <output data-gain-output>100</output></span>
          <input data-gain type="range" min="0" max="600" step="50" value="100" disabled>
        </label>
        <div class="setting-evidence" data-setting-evidence="gain" aria-label="ISO state"></div>
        <div class="control-actions">
          <button data-control="treatment-monochrome" type="button" disabled>B&amp;W</button>
          <button data-control="treatment-colour" type="button" disabled>Colour</button>
          <button data-control="snapshot" type="button" disabled>Snapshot</button>
        </div>
        <div class="setting-evidence" data-setting-evidence="treatment" aria-label="Treatment state"></div>
        <div class="draft-actions" aria-label="Draft camera settings">
          <button data-control="discard-settings" type="button" disabled>Discard</button>
          <button data-control="apply-settings" type="button" disabled>Apply</button>
        </div>
      </section>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
