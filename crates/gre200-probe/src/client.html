<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ObsCam · GRE-200</title>
  <style>
    :root{color-scheme:dark;--bg:#05080c;--panel:#0d121bee;--line:#ffffff24;--text:#f4f7fa;--muted:#98a5b5;--ok:#65e3b3;--warn:#f3b84a;--bad:#ff6b72}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}
    #stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#25333d 0,transparent 48%),var(--bg)}
    video{display:block;width:100%;height:100%;object-fit:contain;background:#080c11}
    #empty{position:absolute;display:grid;gap:.5rem;text-align:center;color:var(--muted);cursor:pointer}#empty[hidden]{display:none!important}#empty strong{color:var(--text)}
    #status{position:fixed;z-index:20;top:max(.65rem,env(safe-area-inset-top));left:50%;display:flex;align-items:center;gap:.45rem;max-width:calc(100% - 1rem);padding:.45rem .7rem;transform:translateX(-50%);border:1px solid var(--line);border-radius:99px;background:#05080cbd;color:var(--muted);font-size:.7rem;white-space:nowrap}
    #status .dot{width:.45rem;height:.45rem;border-radius:50%;background:var(--warn)}#status.live .dot{background:var(--ok);box-shadow:0 0 .55rem var(--ok)}#status.unavailable .dot,#status.stale .dot{background:var(--bad)}
    #detail{overflow:hidden;text-overflow:ellipsis}
    #diagnostic{position:fixed;z-index:10;right:.6rem;bottom:6rem;max-width:calc(100% - 1.2rem);padding:.5rem .65rem;border:1px solid var(--line);border-radius:.6rem;background:#05080ccc;color:var(--muted);font:600 .65rem ui-monospace,monospace}
    #tray{position:fixed;z-index:30;right:.6rem;bottom:max(.6rem,env(safe-area-inset-bottom));left:.6rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.75rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:1rem;background:var(--panel)}
    #tray p{margin:0;color:var(--muted);font-size:.72rem}button{min-height:2.5rem;padding:0 .9rem;border:1px solid var(--line);border-radius:.7rem;background:#ffffff0d;color:var(--text);font:inherit}
    @media(min-width:700px){#tray{right:50%;left:auto;width:34rem;transform:translateX(50%)}}
  </style>
</head>
<body>
  <main id="stage"><video id="video" autoplay muted playsinline></video><div id="empty"><strong>Connecting to video…</strong><span>Exact frame freshness is not yet known.</span></div></main>
  <div id="status"><span class="dot"></span><strong id="state">Reconnecting</strong><span id="detail">Connecting to video</span></div>
  <div id="diagnostic">epoch — · generation — · RTP — · correlation unknown</div>
  <section id="tray"><p>GRE-200 evidence probe · mutations disabled</p><button id="snapshot">Snapshot</button></section>
  <canvas id="canvas" hidden></canvas>
  <script>
    const video=document.querySelector('#video'),empty=document.querySelector('#empty'),status=document.querySelector('#status'),stateNode=document.querySelector('#state'),detail=document.querySelector('#detail'),diagnostic=document.querySelector('#diagnostic');
    const identityGraceMs=1000;
    const model={runtime:null,frames:new Map(),poisoned:new Set(),peer:null,resource:null,clock:null,retries:0,connecting:false,awaitingFirstFrame:true,lastPresentationAt:performance.now(),lastCorrelatedAt:performance.now(),mediaAttemptStartedAt:performance.now(),lastInboundBytes:null,lastMediaProgressAt:performance.now(),capture:null,pendingCapture:null};
    const createClientId=()=>globalThis.crypto?.randomUUID?.().replaceAll('-','')||`${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
    const clientId=sessionStorage.gre200ClientId||(sessionStorage.gre200ClientId=createClientId());
    const setState=(name,message)=>{status.className=name.toLowerCase();stateNode.textContent=name;detail.textContent=message};
    function install(frame){if(!model.runtime||frame.runtime_epoch!==model.runtime.runtime_epoch)return;if(frame.stream_epoch!==model.runtime.stream_epoch){if(frame.stream_epoch<model.runtime.stream_epoch)return;model.runtime.stream_epoch=frame.stream_epoch;model.frames.clear();model.poisoned.clear()}const key=String(frame.rtp_timestamp),old=model.frames.get(key);if(old&&JSON.stringify(old)!==JSON.stringify(frame)){model.frames.delete(key);model.poisoned.add(key)}else if(!model.poisoned.has(key))model.frames.set(key,frame);while(model.frames.size>4096)model.frames.delete(model.frames.keys().next().value)}
    async function calibrate(){const samples=[];for(let i=0;i<7;i++){const before=Date.now();try{const clock=await fetch('/api/clock',{cache:'no-store'}).then(r=>r.json()),after=Date.now(),serverReceive=Number(clock.server_receive_unix_ns)/1e6,serverSend=Number(clock.server_send_unix_ns)/1e6;samples.push({offset_ms:(serverReceive+serverSend-before-after)/2,uncertainty_ms:Math.max(0,(after-before-(serverSend-serverReceive))/2)})}catch{}await new Promise(resolve=>setTimeout(resolve,30))}samples.sort((a,b)=>a.uncertainty_ms-b.uncertainty_ms);model.clock=samples[0]||null}
    function acceptCapture(capture){model.capture=capture;if(!model.pendingCapture||capture.settings_generation!==model.pendingCapture.settings_generation)model.pendingCapture=capture}
    function telemetry(){const protocol=location.protocol==='https:'?'wss':'ws',socket=new WebSocket(`${protocol}://${location.host}/ws/telemetry`);socket.onmessage=event=>{const message=JSON.parse(event.data);if(message.type==='runtime'){model.runtime=message;model.frames.clear();model.poisoned.clear();message.frames.forEach(install);if(message.capture)acceptCapture(message.capture)}else if(message.type==='frame')install(message.frame);else if(message.type==='capture')acceptCapture(message.capture)};socket.onclose=()=>setTimeout(telemetry,1000)}
    function waitIce(peer){if(peer.iceGatheringState==='complete')return Promise.resolve();return new Promise(resolve=>{const done=()=>{if(peer.iceGatheringState==='complete'){peer.removeEventListener('icegatheringstatechange',done);resolve()}};peer.addEventListener('icegatheringstatechange',done);setTimeout(resolve,750)})}
    function endpoint(whep){const parsed=new URL(location.origin);parsed.port=String(whep.port);parsed.pathname=whep.path;parsed.search='';parsed.hash='';return parsed.toString()}
    async function closeMedia(){if(model.resource)fetch(model.resource,{method:'DELETE'}).catch(()=>{});model.resource=null;const peer=model.peer;model.peer=null;if(peer)peer.close()}
    async function connect(){if(model.connecting)return;model.connecting=true;model.awaitingFirstFrame=true;model.lastPresentationAt=performance.now();model.mediaAttemptStartedAt=model.lastPresentationAt;model.lastInboundBytes=null;model.lastMediaProgressAt=model.lastPresentationAt;await closeMedia();setState('Reconnecting',model.retries?'Restoring video':'Connecting to video');try{const runtime=await fetch('/api/runtime',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`runtime ${r.status}`);return r.json()});if(!model.runtime||model.runtime.runtime_epoch!==runtime.runtime_epoch){model.runtime=runtime;model.frames.clear();model.poisoned.clear()}if(runtime.capture)acceptCapture(runtime.capture);const peer=new RTCPeerConnection();model.peer=peer;peer.addTransceiver('video',{direction:'recvonly'});peer.ontrack=async event=>{video.srcObject=event.streams[0]||new MediaStream([event.track]);try{await video.play();setState('Reconnecting','Video playing · waiting for exact identity')}catch(error){setState('Unavailable','Tap video to start playback');empty.innerHTML=`<strong>Tap to start video</strong><span>${error.name}</span>`}};peer.onconnectionstatechange=()=>{if(peer===model.peer&&['failed','closed'].includes(peer.connectionState)){model.retries++;connect()}};await peer.setLocalDescription(await peer.createOffer());await waitIce(peer);const whep=endpoint(runtime.whep),response=await fetch(whep,{method:'POST',headers:{'Content-Type':'application/sdp'},body:peer.localDescription.sdp});if(!response.ok)throw new Error(`WHEP ${response.status}`);const locationHeader=response.headers.get('Location');if(locationHeader)model.resource=new URL(locationHeader,whep).toString();await peer.setRemoteDescription({type:'answer',sdp:await response.text()});model.retries=0}catch(error){setState('Reconnecting',String(error));model.retries++;setTimeout(connect,Math.min(2000,500*2**Math.min(model.retries,4)))}finally{model.connecting=false}}
    async function presented(now,metadata){model.lastPresentationAt=now;const rtp=Number.isInteger(metadata.rtpTimestamp)?metadata.rtpTimestamp:null;const event={schema_version:3,client_id:clientId,runtime_epoch:model.runtime?.runtime_epoch||'unknown',stream_epoch:model.runtime?.stream_epoch||1,rtp_timestamp:rtp,expected_display_unix_ms:performance.timeOrigin+metadata.expectedDisplayTime+(model.clock?.offset_ms||0),clock_uncertainty_ms:model.clock?.uncertainty_ms??null,presented_frames:metadata.presentedFrames,width:metadata.width,height:metadata.height,visibility_state:document.hidden?'hidden':'visible'};let result=null,reportError=null;try{const response=await fetch('/api/presentations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)});if(!response.ok)throw new Error(`presentation ${response.status}`);result=await response.json()}catch(error){reportError=error}if(result?.status==='correlated'&&result.frame){model.awaitingFirstFrame=false;model.lastCorrelatedAt=now;if(model.pendingCapture&&result.frame.source_generation>=model.pendingCapture.source_generation)model.pendingCapture=null;empty.hidden=true;setState('Live',`${result.frame.treatment} · generation ${result.frame.source_generation}`);diagnostic.textContent=`epoch ${result.frame.runtime_epoch.slice(0,8)} · generation ${result.frame.source_generation} · RTP ${rtp} · exact${result.exposure_end_to_visible_ms===null?'':` · ${result.exposure_end_to_visible_ms.toFixed(1)}±${result.clock_uncertainty_ms.toFixed(1)}ms`}`}else if(model.awaitingFirstFrame){setState('Reconnecting','Waiting for first decodable frame')}else if(reportError||!result){empty.hidden=false;empty.innerHTML='<strong>Correlation service unavailable</strong><span>Video remains connected; frame identity is unknown.</span>';setState('Unavailable','Correlation service unavailable');diagnostic.textContent=`epoch ${model.runtime?.runtime_epoch?.slice(0,8)||'—'} · generation — · RTP ${rtp??'absent'} · presentation report failed`}else if(now-model.lastCorrelatedAt>identityGraceMs){empty.hidden=false;empty.innerHTML=`<strong>Frame identity unavailable</strong><span>${result.status}</span>`;setState('Stale','Frame freshness unknown');diagnostic.textContent=`epoch ${model.runtime?.runtime_epoch?.slice(0,8)||'—'} · generation — · RTP ${rtp??'absent'} · ${result.status}`}video.requestVideoFrameCallback(presented)}
    async function checkMediaProgress(){const peer=model.peer;if(!peer||model.connecting||document.hidden)return;try{let bytes=0,found=false;(await peer.getStats()).forEach(report=>{if(report.type==='inbound-rtp'&&(report.kind==='video'||report.mediaType==='video')){bytes+=report.bytesReceived||0;found=true}});const now=performance.now();if(found&&(model.lastInboundBytes===null||bytes>model.lastInboundBytes)){model.lastInboundBytes=bytes;model.lastMediaProgressAt=now;return}if(model.lastInboundBytes!==null&&now-model.lastMediaProgressAt>2500&&now-model.mediaAttemptStartedAt>4000){model.retries++;connect()}}catch{}}
    empty.onclick=()=>video.play().catch(()=>{});document.querySelector('#snapshot').onclick=()=>{const canvas=document.querySelector('#canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d',{alpha:false}).drawImage(video,0,0);canvas.toBlob(blob=>{if(!blob)return;const link=document.createElement('a');link.download='obscam-gre200-visible-frame.jpg';link.href=URL.createObjectURL(blob);link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)},'image/jpeg',.94)};
    if('requestVideoFrameCallback' in HTMLVideoElement.prototype)video.requestVideoFrameCallback(presented);else{setState('Unavailable','requestVideoFrameCallback unsupported');empty.innerHTML='<strong>Exact correlation unavailable</strong><span>This browser does not expose presentation callbacks.</span>'}
    setInterval(()=>{const now=performance.now();if(document.hidden||model.connecting||model.awaitingFirstFrame||now-model.lastPresentationAt<identityGraceMs)return;const capture=model.pendingCapture,serverNow=Date.now()+(model.clock?.offset_ms||0),deadline=capture?Number(capture.capture_started_unix_ns)/1e6+capture.exposure_us/1000+500+identityGraceMs:0;if(deadline&&serverNow<=deadline){setState('Capturing',`${(capture.exposure_us/1e6).toFixed(2)}s exposure · generation ${capture.settings_generation}`);return}setState('Stale','Presentation callback delayed')},250);setInterval(checkMediaProgress,500);calibrate();telemetry();connect();
  </script>
</body>
</html>
