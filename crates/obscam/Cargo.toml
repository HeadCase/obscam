[package]
name = "obscam"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
zwo-asi = { version = "0.1.0", path = "../zwo-asi" }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
zwo-asi = { version = "0.1.0", path = "../zwo-asi", features = ["camera-substitute", "sdk-stub"] }

[features]
camera-substitute = ["zwo-asi/camera-substitute"]
sdk-stub = ["zwo-asi/sdk-stub"]

[lints]
workspace = true
