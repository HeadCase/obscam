repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: []

      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
      - id: ty
        name: ty
        # 'uv run' ensures it runs in your project's synced environment.
        # Keep this aligned with CI (see .github/workflows/push_checks.yml),
        # which runs: `uv run --all-groups ty check`.
        entry: uv run ty check 
        language: system
        types: [python]
        pass_filenames: false

