name: Python quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff format
        run: uv run ruff format --check src tests test_mono_format.py test_shutdown.py

      - name: Ruff lint
        run: uv run ruff check src tests test_mono_format.py test_shutdown.py

      - name: Ty
        run: uv run ty check src tests

      - name: Pytest
        run: uv run pytest
