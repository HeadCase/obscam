<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObsCam - Observatory Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', sans-serif;
            /* Tokyo Night Dark Theme - Observatory Appropriate */
            background: linear-gradient(135deg, #16161e 0%, #1a1a29 50%, #24243e 100%);
            color: #c0caf5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            font-size: 0.9rem;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-indicator.error {
            background: #dc3545;
        }
        
        /* Top Controls Above Image */
        .top-controls {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .top-control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }
        
        .top-control-label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .top-control-value {
            font-family: monospace;
            font-weight: bold;
            color: #00d4ff;
            font-size: 1rem;
        }
        
        .top-control-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        .top-control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        .top-control-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* Main Feed Container - FULL WINDOW */
        .feed-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        
        .image-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0;
            padding: 0;
        }
        
        .camera-image {
            /* FULL BROWSER WINDOW SCALING - ALL DEVICES */
            width: 100vw;
            height: calc(100vh - 140px); /* Account for header + top controls + bottom controls */
            max-width: 100vw;
            max-height: calc(100vh - 140px);
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
            transition: opacity 0.2s ease;
            display: block;
        }
        
        .placeholder {
            width: 80%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
        }
        
        /* Bottom Control Panel - Minimal */
        .bottom-controls {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        
        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }
        
        .control-btn.active {
            background: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.5);
        }
        
        .fps-display {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            text-align: center;
        }
        
        /* Status Info */
        .status-info {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }
        
        .status-info span {
            white-space: nowrap;
        }
        
        /* Responsive Design - ALL DEVICES GET FULL WINDOW */
        @media (max-width: 768px) {
            .header {
                padding: 8px 15px;
            }
            
            .header h1 {
                font-size: 1.2rem;
            }
            
            .top-controls {
                flex-direction: column;
                gap: 15px;
                padding: 10px 15px;
            }
            
            .top-control-group {
                min-width: unset;
                width: 100%;
                max-width: 300px;
            }
            
            .camera-image {
                /* Mobile: STILL FULL WINDOW - just adjust for smaller UI */
                width: 100vw;
                height: calc(100vh - 160px); /* Account for stacked mobile controls */
                max-width: 100vw;
                max-height: calc(100vh - 160px);
            }
            
            .bottom-controls {
                padding: 8px 15px;
                gap: 15px;
            }
        }
        
        /* Extra large displays - 4K monitors etc */
        @media (min-width: 1920px) {
            .camera-image {
                width: 100vw;
                height: calc(100vh - 120px); /* Minimal UI overhead on large screens */
                max-width: 100vw;
                max-height: calc(100vh - 120px);
            }
        }
        
        /* Loading states */
        .loading {
            opacity: 0.7;
            animation: loading-pulse 1.5s infinite;
        }
        
        @keyframes loading-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>FastCam Observatory Monitor</h1>
            <div class="connection-status">
                <div class="status-indicator" id="connection-indicator"></div>
                <span id="connection-text">Connecting...</span>
            </div>
        </header>
        
        <!-- Top Controls - Above Image -->
        <div class="top-controls">
            <!-- Exposure Control -->
            <div class="top-control-group">
                <label class="top-control-label">
                    Exposure Time
                    <span class="top-control-value" id="exposure-value">100ms</span>
                </label>
                <input type="range" class="top-control-slider" id="exposure-slider" 
                       min="1" max="10000" value="100" step="1">
            </div>
            
            <!-- Gain Control -->
            <div class="top-control-group">
                <label class="top-control-label">
                    Gain
                    <span class="top-control-value" id="gain-value">250</span>
                </label>
                <input type="range" class="top-control-slider" id="gain-slider" 
                       min="50" max="800" value="250" step="1">
            </div>
        </div>
        
        <!-- Main Camera Feed - FULL WINDOW -->
        <main class="feed-container">
            <div class="image-wrapper">
                <div class="placeholder" id="camera-image">
                    📸 Starting camera feed...
                </div>
            </div>
        </main>
        
        <!-- Bottom Control Panel - Minimal -->
        <div class="bottom-controls">
            <button class="control-btn" id="connect-btn" onclick="connectCamera()">
                Connect
            </button>
            <button class="control-btn active" id="stream-btn" onclick="toggleStream()">
                Streaming
            </button>
            <div class="fps-display" id="fps-display">-- FPS</div>
            <div class="status-info">
                <span>Camera: <span id="camera-status">Initializing</span></span>
                <span>Last: <span id="last-update">--</span></span>
            </div>
        </div>
    </div>

    <script>
        // Application State
        let appState = {
            streaming: false,
            exposure: 100,
            gain: 250,
            isConnected: false,
            streamInterval: null,
            frameCount: 0,
            lastFrameTime: Date.now(),
            fps: 0
        };
        
        // Get the current host and use port 8000 for API calls
        const API_BASE = `http://${window.location.hostname}:8000`;

        // Initialize application
        function initializeApp() {
            updateSliderDisplays();
            checkStatus();
            
            // Start streaming automatically after brief delay
            setTimeout(() => {
                if (appState.isConnected) {
                    startStreaming();
                }
            }, 1000);
        }
        
        // Update slider value displays
        function updateSliderDisplays() {
            document.getElementById('exposure-value').textContent = appState.exposure + 'ms';
            document.getElementById('gain-value').textContent = appState.gain;
        }
        
        // Connection management
        function updateConnectionStatus(connected, message = '') {
            const indicator = document.getElementById('connection-indicator');
            const text = document.getElementById('connection-text');
            const statusValue = document.getElementById('camera-status');
            
            appState.isConnected = connected;
            
            if (connected) {
                indicator.classList.remove('error');
                text.textContent = message || 'Connected';
                statusValue.textContent = 'Connected';
            } else {
                indicator.classList.add('error');
                text.textContent = message || 'Disconnected';
                statusValue.textContent = 'Disconnected';
            }
        }
        
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                const data = await response.json();
                
                if (data.status === 'connected') {
                    updateConnectionStatus(true, 'Connected');
                } else {
                    updateConnectionStatus(false, data.message || 'Not connected');
                }
                
            } catch (error) {
                updateConnectionStatus(false, 'API Error');
                console.error('Status check failed:', error);
            }
        }

        async function connectCamera() {
            try {
                document.getElementById('connect-btn').classList.add('loading');
                updateConnectionStatus(false, 'Connecting...');
                
                const response = await fetch(`${API_BASE}/api/connect`);
                const data = await response.json();
                
                if (data.status === 'connected') {
                    updateConnectionStatus(true, 'Connected');
                    setTimeout(startStreaming, 500);
                } else {
                    updateConnectionStatus(false, data.message || 'Connection failed');
                }
                
            } catch (error) {
                updateConnectionStatus(false, 'Connection error');
                console.error('Connection failed:', error);
            } finally {
                document.getElementById('connect-btn').classList.remove('loading');
            }
        }
        
        // Streaming control
        function toggleStream() {
            const btn = document.getElementById('stream-btn');
            
            if (appState.streaming) {
                stopStreaming();
                btn.textContent = 'Start Stream';
                btn.classList.remove('active');
            } else {
                startStreaming();
                btn.textContent = 'Stop Stream';
                btn.classList.add('active');
            }
        }
        
        function startStreaming() {
            if (appState.streaming || !appState.isConnected) return;
            
            appState.streaming = true;
            appState.frameCount = 0;
            appState.lastFrameTime = Date.now();
            
            // Update button state
            const btn = document.getElementById('stream-btn');
            btn.textContent = 'Streaming';
            btn.classList.add('active');
            
            console.log('Starting continuous capture stream...');
            continuousCapture();
        }
        
        function stopStreaming() {
            appState.streaming = false;
            
            if (appState.streamInterval) {
                clearTimeout(appState.streamInterval);
                appState.streamInterval = null;
            }
            
            console.log('Stopped capture stream');
            document.getElementById('fps-display').textContent = '-- FPS';
        }
        
        // Ultra-fast continuous capture loop
        async function continuousCapture() {
            if (!appState.streaming) return;
            
            try {
                const startTime = performance.now();
                
                // Fetch image with current settings
                const response = await fetch(
                    `${API_BASE}/api/capture-fast?exp=${appState.exposure}&gain=${appState.gain}`,
                    { cache: 'no-cache' }
                );
                
                if (response.ok) {
                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    // Update image immediately
                    const imgContainer = document.getElementById('camera-image');
                    imgContainer.innerHTML = `<img src="${imageUrl}" alt="Camera Feed" class="camera-image">`;
                    
                    // Cleanup the blob URL to prevent memory leaks
                    setTimeout(() => URL.revokeObjectURL(imageUrl), 1000);
                    
                    // Update FPS counter
                    updateFpsCounter();
                    
                    // Update status
                    const now = new Date();
                    document.getElementById('last-update').textContent = now.toLocaleTimeString();
                    
                } else {
                    console.error('Capture failed:', response.status, response.statusText);
                }
                
            } catch (error) {
                console.error('Capture error:', error);
                updateConnectionStatus(false, 'Capture error');
            }
            
            // Schedule next capture immediately if still streaming
            if (appState.streaming) {
                appState.streamInterval = setTimeout(continuousCapture, 10); // Minimal delay
            }
        }
        
        function updateFpsCounter() {
            appState.frameCount++;
            const now = Date.now();
            const elapsed = now - appState.lastFrameTime;
            
            // Update FPS every 10 frames or every 2 seconds
            if (appState.frameCount % 10 === 0 || elapsed > 2000) {
                appState.fps = (appState.frameCount * 1000) / elapsed;
                document.getElementById('fps-display').textContent = `${appState.fps.toFixed(1)} FPS`;
                
                // Reset counters
                appState.frameCount = 0;
                appState.lastFrameTime = now;
            }
        }
        
        // Settings update handlers
        document.addEventListener('DOMContentLoaded', function() {
            // Exposure slider
            document.getElementById('exposure-slider').addEventListener('input', function() {
                appState.exposure = parseInt(this.value);
                document.getElementById('exposure-value').textContent = appState.exposure + 'ms';
            });
            
            // Gain slider  
            document.getElementById('gain-slider').addEventListener('input', function() {
                appState.gain = parseInt(this.value);
                document.getElementById('gain-value').textContent = appState.gain;
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ') {
                    e.preventDefault();
                    toggleStream();
                } else if (e.key === 'c') {
                    connectCamera();
                }
            });
            
            // Initialize slider values
            updateSliderDisplays();
        });

        // Start the application
        initializeApp();
        
        // Periodic status check (every 30 seconds when not streaming)
        setInterval(() => {
            if (!appState.streaming) {
                checkStatus();
            }
        }, 30000);
    </script>
</body>
</html>
