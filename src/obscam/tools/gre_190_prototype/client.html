<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRE-190 autonomous browser probe</title>
<style>
  body { margin: 0; color: #eee; background: #111; font: 14px system-ui; }
  main { display: grid; gap: 12px; padding: 12px; }
  canvas, img { width: min(100%, 1920px); background: #222; }
  pre { white-space: pre-wrap; }
  .complete { color: #8fda8f; font-size: 1.3rem; }
  .failed { color: #ff8e8e; font-size: 1.3rem; }
</style>
<main>
  <div id="state">Ready</div>
  <div>
    <button id="start">Start configured run</button>
    <button id="mjpeg">View MJPEG control</button>
    <button id="stop">Stop</button>
  </div>
  <canvas id="view" width="1920" height="1080"></canvas>
  <img id="mjpeg-view" width="1920" height="1080" hidden alt="MJPEG control">
  <pre id="metrics"></pre>
</main>
<script>
const params = new URLSearchParams(location.search);
const config = {
  runId: params.get('run') || `manual-${new Date().toISOString().replaceAll(':', '-')}`,
  clientId: params.get('client') || crypto.randomUUID(),
  durationS: Math.min(3600, Math.max(5, Number(params.get('duration') || 60))),
  reconnect: params.get('reconnect') !== '0',
  auto: params.get('auto') === '1',
  treatment: params.get('treatment') || 'colour',
};
if (!['colour', 'mono'].includes(config.treatment)) {
  throw new Error(`Unknown treatment: ${config.treatment}`);
}
const state = document.querySelector('#state');
const metrics = document.querySelector('#metrics');
const canvas = document.querySelector('#view');
const context = canvas.getContext('2d', {alpha: false});
const mjpegView = document.querySelector('#mjpeg-view');
let socket;
let stopped = false;
let running = false;

const unixNowMs = () => performance.timeOrigin + performance.now();
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function calibrateClock() {
  const samples = [];
  for (let index = 0; index < 9; index++) {
    const browserSend = unixNowMs();
    const response = await fetch(`/api/clock?sample=${index}`, {cache: 'no-store'});
    const payload = await response.json();
    const browserReceive = unixNowMs();
    const serverMid = (payload.server_receive_unix_ns + payload.server_send_unix_ns) / 2e6;
    const browserMid = (browserSend + browserReceive) / 2;
    samples.push({browser_send_unix_ms: browserSend,
      server_receive_unix_ns: payload.server_receive_unix_ns,
      server_send_unix_ns: payload.server_send_unix_ns,
      browser_receive_unix_ms: browserReceive,
      offset_ms: serverMid - browserMid,
      uncertainty_ms: (browserReceive - browserSend) / 2});
    await wait(40);
  }
  samples.sort((left, right) => left.uncertainty_ms - right.uncertainty_ms);
  return samples[0];
}

function websocketUrl() {
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${protocol}://${location.host}/ws/jpeg/${config.treatment}`;
}

async function run() {
  if (running) return;
  running = true; stopped = false;
  mjpegView.hidden = true; canvas.hidden = false;
  state.className = ''; state.textContent = 'Calibrating clocks…';
  const clock = await calibrateClock();
  const started = unixNowMs();
  const deadline = performance.now() + config.durationS * 1000;
  const reconnectAt = performance.now() + config.durationS * 500;
  let reconnectTriggered = !config.reconnect;
  let received = 0, unique = 0, skipped = 0, reconnects = 0, hidden = 0;
  let lastGeneration = 0;
  const presentations = [];
  const errors = [];

  function connect() {
    return new Promise((resolve, reject) => {
      socket = new WebSocket(websocketUrl());
      socket.binaryType = 'arraybuffer';
      socket.onopen = resolve;
      socket.onerror = () => reject(new Error('WebSocket connection failed'));
      socket.onmessage = async event => {
        const receive = unixNowMs();
        received++;
        try {
          const bytes = new Uint8Array(event.data);
          const headerLength = new DataView(event.data).getUint32(0);
          const envelope = JSON.parse(new TextDecoder().decode(bytes.slice(4, 4 + headerLength)));
          const blob = new Blob([bytes.slice(4 + headerLength)], {type: 'image/jpeg'});
          const bitmap = await createImageBitmap(blob);
          const decode = unixNowMs();
          context.drawImage(bitmap, 0, 0);
          bitmap.close();
          await new Promise(resolveFrame => requestAnimationFrame(resolveFrame));
          const visible = unixNowMs();
          if (envelope.generation !== lastGeneration) {
            if (lastGeneration && envelope.generation > lastGeneration + 1) {
              skipped += envelope.generation - lastGeneration - 1;
            }
            lastGeneration = envelope.generation;
            unique++;
            if (document.visibilityState !== 'visible') hidden++;
            presentations.push({schema_version: 1, client_id: config.clientId,
              path: 'jpeg-websocket', generation: envelope.generation,
              browser_receive_ms: receive, decode_complete_ms: decode,
              visible_ms: visible, server_encode_end_ns: envelope.encode_end_ns,
              clock_offset_ms: clock.offset_ms,
              clock_uncertainty_ms: clock.uncertainty_ms,
              visibility_state: document.visibilityState});
          }
          metrics.textContent = JSON.stringify({config, received, unique, skipped,
            reconnects, hidden, clock_uncertainty_ms: clock.uncertainty_ms,
            receive_to_visible_ms: visible - receive}, null, 2);
        } catch (error) { errors.push(String(error)); }
      };
    });
  }

  try {
    state.textContent = 'Running—keep this tab visible';
    await connect();
    while (!stopped && performance.now() < deadline) {
      if (!reconnectTriggered && performance.now() >= reconnectAt) {
        reconnectTriggered = true; socket.close(); await wait(1000);
        reconnects++; await connect();
      }
      await wait(50);
    }
  } catch (error) { errors.push(String(error)); }
  socket?.close();
  const report = {schema_version: 1, run_id: config.runId, client_id: config.clientId,
    path: 'jpeg-websocket', user_agent: navigator.userAgent,
    started_unix_ms: started, completed_unix_ms: unixNowMs(),
    requested_duration_s: config.durationS, received_frames: received,
    unique_presented_frames: unique, skipped_generations: skipped,
    reconnects, hidden_events: hidden, clock, presentations, errors};
  const response = await fetch('/api/runs', {method: 'POST',
    headers: {'content-type': 'application/json'}, body: JSON.stringify(report)});
  if (response.ok) {
    state.className = 'complete';
    state.textContent = `COMPLETE — ${config.runId}/${config.clientId} stored; safe to close`;
  } else {
    state.className = 'failed';
    state.textContent = `UPLOAD FAILED (${response.status}) — leave this tab open`;
    metrics.textContent += `\n${await response.text()}`;
  }
  running = false;
}

document.querySelector('#start').onclick = run;
document.querySelector('#mjpeg').onclick = () => {
  socket?.close(); canvas.hidden = true; mjpegView.hidden = false;
  mjpegView.src = `/mjpeg?cache=${Date.now()}`;
};
document.querySelector('#stop').onclick = () => { stopped = true; socket?.close(); };
metrics.textContent = JSON.stringify(config, null, 2);
if (config.auto) run();
</script>
