# Throwaway GRE-190 gateway configuration. Never install as a system service.
logLevel: debug
logDestinations: [stdout]
readTimeout: 45s

api: true
apiAddress: 127.0.0.1:19997
metrics: true
metricsAddress: 127.0.0.1:19998

rtsp: true
rtspAddress: 127.0.0.1:18554
rtspTransports: [tcp]

rtmp: false
hls: false
srt: false
playback: false

webrtc: true
webrtcAddress: :18889
webrtcEncryption: false
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :18189
webrtcLocalTCPAddress: :18190
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [192.168.1.200, 10.164.190.1]

pathDefaults:
  record: false

paths:
  gre190:
    source: publisher
